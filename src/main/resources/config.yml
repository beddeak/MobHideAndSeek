# Paper 1.21.4 / Java 21. LibsDisguises 및 해당 버전에 맞는 의존 플러그인이 필요합니다.
round-seconds: 180
hide-seconds: 15
# AI 몹 오답 허용 횟수. 술래 최대 체력은 횟수 × 2 HP이며 매 오답에 하트 한 칸(2 HP)이 줄어듭니다.
# /mh sethits <횟수>로 1~20 사이에서 설정할 수 있습니다.
seeker-mistake-limit: 20
hider-hit-limit: 2
speed-multiplier: 1.0
# 술래에게 유효 타격을 받고 살아남은 숨는 플레이어의 도주 가속. 0초면 비활성화.
# 숨는 플레이어의 연속 피격 방지 간격은 10틱(20 TPS에서 0.5초)이며 가속과 별개입니다.
# 기본 속도의 2배와 최소 도주 속도 0.30 중 빠른 값 사용 (상한 0.5).
hit-speed-boost:
  seconds: 3 # 0~10초, 정상 20 TPS 기준. 연속 피격은 남은 시간만 갱신.
  multiplier: 2.0 # 1~4배
  minimum-walk-speed: 0.30 # 0~0.5, 기본 플레이어 걷기 속도는 0.2
# 점수: 숨는 사람마다 추격 시간을 술래와 나눠 갖습니다. 버틴 시간은 숨는 사람, 잡힌 뒤 남은 시간은 술래 몫입니다.
# 숨을 시간은 포함하지 않습니다. 일반 경기만 리더보드에 누적하며 테스트·샌드박스·관리자 개입 경기는 제외합니다.
score:
  seconds-per-point: 10 # 0~600. 추격 중 이 초만큼 버티면 1점. 0이면 시간 점수 없이 보너스만 사용
  survive-bonus: 5 # 0~100. 숨는 팀이 이겼을 때 살아남은 사람. 술래 HP 소진으로 일찍 끝나도 시간 점수 전부를 받음
  catch-bonus: 5 # 0~100. 술래가 한 명 잡을 때마다
  all-caught-bonus: 5 # 0~100. 술래가 마지막 사람까지 잡았을 때
# 폭죽 도발: 숨는 팀이 F(손 바꾸기) 또는 /mh taunt로 자기 위치에 폭죽을 터뜨리고 점수를 받습니다.
# 추격 중에만 쓸 수 있고 받은 점수는 잡혀도 유지합니다. 위험은 위치가 드러나는 것입니다.
taunt:
  points: 5 # 0~100. 0이면 도발 끔(F는 원래 손 바꾸기)
  cooldown-seconds: 10 # 5~600. 사람마다 따로 계산. /mh admin 에서 5초 단위로 바꾸면 진행 중에도 바로 적용
  glow-seconds: 5 # 0~15. 도발한 자리에 벽 너머로도 보이는 발광 기둥을 남기는 시간. 0이면 끔
# 관리자 패널의 다음 경기 술래/개별 몹·피·속도 설정은 아래 키에 저장됩니다.
fixed-seeker: ''
players: {}
decoy-count: 25 # 플레이어의 변신 종류마다 AI를 최소 한 마리 보장합니다. 필요하면 이 수보다 늘어납니다.
# /mh setarena <반경> 또는 /mh setradius <반경>으로 5~64블록 사이에서 설정합니다.
arena-radius: 20
# 각 숨는 플레이어에게 이 목록에서 랜덤 추첨합니다. AI도 같은 목록으로 배치하며 중복 당첨이 가능합니다.
mob-types: [COW, PIG, SHEEP, CHICKEN, RABBIT, ZOMBIE, SKELETON, CREEPER, VILLAGER, IRON_GOLEM, WOLF, CAT, MOOSHROOM, HUSK, STRAY]
# 맵 목록은 maps.yml에 별도 저장됩니다. 첫 실행 때 아래 arena를 '햇살 마을'로 가져옵니다.
# /mh setarena, /mh spawnheight 후 /mh mapsave <ID> <이름>으로 랜덤 맵 목록에 반영합니다.
# 소환 발 높이는 /mh spawnheight <최소Y> <최대Y>로 경기장 경계와 별도로 제한합니다.
# 예: 지면이 Y=63인 맵은 /mh spawnheight 64 64. 천장·지붕은 후보에서 제외됩니다.
# arena.spawn-min-y / arena.spawn-max-y 미설정 시 시작점의 위아래 5블록 안에서 기준층부터 탐색합니다.
